          base64 -d /tmp/jarvis.b64 > /tmp/jarvis.zip
          unzip -q /tmp/jarvis.zip -d jarvis_source
          PROJECT_DIR="$(find jarvis_source -mindepth 1 -maxdepth 1 -type d -name 'JarvisApp_*' -print -quit)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: project folder was not found"
            find jarvis_source -maxdepth 2 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "Checking source files..."
          find app/src/main -type f | sort
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
          print("XML OK")
          PY

      - name: Build APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-parallel --max-workers=2             -Dkotlin.compiler.execution.strategy=in-process             clean assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show real build error
        if: steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "========== REAL BUILD ERROR =========="
          grep -n -E "e: |error:|ERROR|FAILURE:|Execution failed|Caused by:" build.log | tail -120 || true
          echo "========== LAST 180 LINES =========="
          tail -180 build.log
          exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          echo "APK=$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-FINAL-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: warn
