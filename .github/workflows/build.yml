name: Build Jarvis 6.1.2

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Recreate clean Jarvis project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf JarvisApp_6.1-UltraVoiceWake
          mkdir -p JarvisApp_6.1-UltraVoiceWake
          python3 - <<'PY'
          import base64, zipfile, io, pathlib, shutil
          raw=base64.b64decode("")
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              z.extractall(".")
          p=pathlib.Path("JarvisApp_6.1-UltraVoiceWake")
          assert (p/"settings.gradle").is_file()
          assert (p/"app/build.gradle").is_file()
          print("Project recreated:", p.resolve())
          PY
      - name: Validate source
        shell: bash
        working-directory: JarvisApp_6.1-UltraVoiceWake
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/jarvis/assistant/OverlayService.kt
          test -f app/src/main/java/com/jarvis/assistant/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
          print("XML OK")
          PY
      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        working-directory: JarvisApp_6.1-UltraVoiceWake
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug --stacktrace --console=plain 2>&1 | tee ../build.log
      - name: Print actual build errors
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "========== ACTUAL BUILD ERROR =========="
          grep -nE "(^e: |error:|FAILURE:|What went wrong:|Execution failed for task|Caused by:)" JarvisApp_6.1-UltraVoiceWake/build.log | tail -80 || true
          echo "========== END ACTUAL BUILD ERROR =========="
          exit 1
      - name: Verify APK
        shell: bash
        working-directory: JarvisApp_6.1-UltraVoiceWake
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-6.1.2-debug-apk
          path: JarvisApp_6.1-UltraVoiceWake/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-log
          path: JarvisApp_6.1-UltraVoiceWake/build.log
          if-no-files-found: ignore
