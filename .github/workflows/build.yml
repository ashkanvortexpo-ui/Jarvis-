        run: |
          set -euo pipefail
          rm -rf JarvisApp_6.1.1-UltraVoiceWake JarvisApp_6.1-UltraVoiceWake
          printf '%s' "$JARVIS_ZIP_B64" | tr -d '\n\r ' | base64 -d > /tmp/jarvis.zip
          unzip -q /tmp/jarvis.zip
          PROJECT_DIR="$(find . -maxdepth 1 -mindepth 1 -type d -name 'JarvisApp_*' -print -quit)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/jarvis/assistant/OverlayService.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Validate source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 15' app/build.gradle
          grep -q 'EXTRA_PARTIAL_RESULTS, true' app/src/main/java/com/jarvis/assistant/OverlayService.kt
          grep -q 'finishAndRemoveTask' app/src/main/java/com/jarvis/assistant/MainActivity.kt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/AndroidManifest.xml')
          print('Manifest XML OK')
          PY
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-6.1.1-UltraVoiceWake-APK
          path: JarvisApp_6.1.1-UltraVoiceWake/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
